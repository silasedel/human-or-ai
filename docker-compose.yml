# Local PostgreSQL for development.
#   docker compose up -d
# Then set in .env:
#   DATABASE_URL="postgresql://postgres:postgres@localhost:5432/humanorai"
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: humanorai
    ports:
      - "5432:5432"
    volumes:
      - humanorai-pgdata:/var/lib/postgresql/data

volumes:
  humanorai-pgdata:
